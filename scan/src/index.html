<!doctype html>
<meta charset="utf-8">
<title>tappscan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Palette taken from 0G's own explorer (storagescan-galileo.0g.ai): violet brand
     on white, near-black text, monospace for hashes, 10px cards, pill badges. */
  :root {
    --bg:#fff; --surface:#fff; --fg:#141414; --dim:#484848;
    --line:#ebebeb; --line-strong:#e5e5e5;
    --brand:#9200e1; --brand-soft:#b75fff; --brand-tint:#f3e6fe;
    --ok:#0e7a4a; --ok-tint:#e6f6ee;
    --bad:#c62828; --bad-tint:#fdeaea;
    --warn:#8a5a00; --warn-tint:#fdf3e2;
    --mono: ui-monospace, "GeistMono", SFMono-Regular, Menlo, monospace;
    --sans: "Metropolis", "Regola", -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0d0d0f; --surface:#161619; --fg:#f2f2f2; --dim:#a0a0a8;
      --line:#26262b; --line-strong:#32323a;
      --brand:#b75fff; --brand-soft:#9200e1; --brand-tint:#241033;
      --ok:#5fd6a0; --ok-tint:#10241b;
      --bad:#ff8a80; --bad-tint:#2c1413;
      --warn:#ffcc80; --warn-tint:#2b2010;
    }
  }
  * { box-sizing:border-box }
  body { margin:0 auto; padding:2rem 1.5rem 3rem; max-width:1180px;
         background:var(--bg); color:var(--fg); font:15px/1.55 var(--sans);
         -webkit-font-smoothing:antialiased; }
  code, .mono, td.mono, th.mono { font-family:var(--mono); font-size:.92em }

  header { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem }
  h1 { font-size:1.35rem; font-weight:700; margin:0; letter-spacing:-.01em }
  h1 span { color:var(--brand) }
  .tag { font-size:.7rem; text-transform:uppercase; letter-spacing:.08em;
         color:var(--brand); background:var(--brand-tint);
         padding:.15rem .5rem; border-radius:9999px; font-weight:600 }
  .sub { color:var(--dim); font-size:.86rem; margin:0 0 1.5rem; font-family:var(--mono) }
  .sub b { color:var(--fg); font-weight:600 }

  .panel { background:var(--surface); border:1px solid var(--line);
           border-radius:10px; overflow:hidden; margin-bottom:1rem }
  table { border-collapse:collapse; width:100% }
  th, td { text-align:left; padding:.6rem .85rem; white-space:nowrap;
           border-bottom:1px solid var(--line) }
  thead th { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em;
             color:var(--dim); font-weight:600; background:var(--bg) }
  tbody tr:last-child td { border-bottom:0 }
  tbody tr[data-app] { cursor:pointer }
  tbody tr[data-app]:hover { background:var(--brand-tint) }
  .num { text-align:right; font-family:var(--mono) }
  .wrap { overflow-x:auto }

  /* pill badges, as on the reference explorer */
  .pill { display:inline-block; padding:.12rem .55rem; border-radius:9999px;
          font-size:.76rem; font-weight:600; white-space:nowrap }
  .pill-ok { color:var(--ok); background:var(--ok-tint) }
  .pill-bad { color:var(--bad); background:var(--bad-tint) }
  .pill-warn { color:var(--warn); background:var(--warn-tint) }
  .pill-dim { color:var(--dim); background:var(--line) }
  .ok { color:var(--ok) } .bad { color:var(--bad) } .warn { color:var(--warn) } .dim { color:var(--dim) }

  .card { background:var(--surface); border:1px solid var(--line);
          border-radius:10px; padding:1.1rem 1.25rem; margin:1rem 0 }
  .card h3 { margin:0 0 .1rem; font-size:.95rem; font-family:var(--mono);
             font-weight:600; overflow-wrap:anywhere }
  h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.07em;
       color:var(--dim); margin:2rem 0 .5rem }
  .kv { display:grid; grid-template-columns:max-content 1fr; gap:.3rem 1.1rem; margin:.8rem 0 0 }
  .kv dt { color:var(--dim); font-size:.82rem; text-transform:uppercase; letter-spacing:.04em }
  .kv dd { margin:0; overflow-wrap:anywhere; font-size:.9rem }

  button { font:inherit; font-size:.82rem; background:var(--bg);
           border:1px solid var(--line-strong); color:var(--fg);
           border-radius:9999px; padding:.2rem .75rem; cursor:pointer }
  button:hover { border-color:var(--brand); color:var(--brand) }
  a { color:var(--brand) }
  pre { margin:.6rem 0 0; overflow-x:auto; font-family:var(--mono); font-size:.8rem;
        background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:.7rem }
</style>

<header><h1>tapp<span>scan</span></h1><span class="tag">trust layer 3</span></header>
<p class="sub" id="head">loading…</p>
<div id="view"></div>

<script>
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild }
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const short = (s, n = 10) => s && s.length > n * 2 ? s.slice(0, n) + '…' + s.slice(-4) : (s ?? '')

function age(secs) {
  if (secs == null) return '—'
  if (secs < 60) return secs + 's ago'
  if (secs < 3600) return Math.floor(secs / 60) + 'm ago'
  if (secs < 86400) return Math.floor(secs / 3600) + 'h ago'
  return Math.floor(secs / 86400) + 'd ago'
}

async function get(path) {
  const r = await fetch(path)
  if (!r.ok) throw new Error(path + ' → ' + r.status)
  return r.json()
}

// Registered / reachable / verified stay three separate numbers.
//
// Registration is what actually authorises a node — it is how a node obtains the
// app's KMS key — and it says nothing about whether the node is up: most
// registered nodes on the live registry cannot be reached at all. Verification is
// an observation made afterwards, on top of being reachable. Collapsing these into
// one indicator would hide the two gaps worth looking at.
function pill(cls, text) { return `<span class="pill pill-${cls}">${text}</span>` }

function aliveCell(a) {
  if (!a.signers.length) return pill('dim', 'no node')
  if (!a.reachable && !a.failed) return pill('dim', 'not checked')
  if (!a.reachable) return pill('bad', 'unreachable')
  return pill('ok', a.reachable === a.signers.length ? 'alive' : `alive ${a.reachable}/${a.signers.length}`)
}

function verifiedCell(a) {
  if (!a.signers.length) return '<span class="dim">—</span>'
  if (!a.reachable && !a.failed) return '<span class="dim">—</span>'
  if (!a.reachable) return '<span class="dim">no evidence</span>'
  if (a.images.length === 1 && a.identified === a.reachable)
    return `${pill('ok', '✓')} <code>${esc(a.images[0])}</code>`
  if (a.images.length > 1) return pill('warn', `${a.images.length} different images`)
  if (!a.identified) return pill('warn', 'image unknown')
  return `${pill('warn', `${a.identified}/${a.reachable}`)} <code>${esc(a.images[0])}</code>`
}

// An app with no registered node, or whose every registered node failed to answer,
// is not something you can look at — it is off. Those are hidden unless asked for,
// so the list is what is actually running. Apps not yet checked stay visible: on a
// cold start that is everything, and hiding them would show an empty registry.
const isOff = (a) => !a.signers.length || (a.failed > 0 && a.reachable === 0)
let showOff = false

async function showList() {
  location.hash = ''
  const [h, all] = await Promise.all([get('/api/health'), get('/api/apps')])
  document.getElementById('head').innerHTML =
    `registry <b>${esc(h.contract)}</b> · chain ${h.chain_id} · block <b>${h.scanned_to_block}</b> ·
     ${h.apps} apps · ${h.events} events · refreshed ${age(h.now - h.refreshed_at)}`

  const hidden = all.filter(isOff).length
  const apps = showOff ? all : all.filter(a => !isOff(a))

  const rows = apps.map(a => `
    <tr data-app="${esc(a.app_id)}">
      <td>${a.unnamed
        ? '<span class="dim mono" title="plaintext app id could not be recovered">' + short(a.app_id) + '</span>'
        : esc(a.app_id)}</td>
      <td>${aliveCell(a)}</td>
      <td class="num">${a.signers.length}</td>
      <td class="num">${a.reachable}</td>
      <td class="num dim">${a.signers_ever}</td>
      <td class="num dim">${a.events}</td>
      <td>${verifiedCell(a)}</td>
      <td class="dim mono">${age(a.oldest_result_age)}</td>
    </tr>`).join('')

  const view = document.getElementById('view')
  view.innerHTML = `<div class="panel wrap"><table>
    <thead><tr><th>app</th><th></th>
    <th class="num" title="current nodes on chain — these, and only these, can obtain the app's KMS key">registered</th>
    <th class="num" title="of those, how many answered with evidence">reachable</th>
    <th class="num" title="distinct signers over the app's whole life">signers ever</th>
    <th class="num">events</th>
    <th title="boot chain matched a published reference set">verified</th>
    <th>as of</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    ${hidden ? `<button id="toggle-off">${showOff
      ? 'hide the ' + hidden + ' that are off'
      : 'show ' + hidden + ' with no reachable node'}</button>` : ''}`
  view.querySelectorAll('tr[data-app]').forEach(tr =>
    tr.onclick = () => showApp(tr.dataset.app))
  const toggle = document.getElementById('toggle-off')
  if (toggle) toggle.onclick = () => { showOff = !showOff; showList() }
}

// One card per SIGNER — current or retired, same shape. The signer is the unit
// that carries a verification status and a trace; the only difference is whether
// the result can be produced again, since a retired signer's RTMRs are gone with
// its instance.
function signerCard(h, now) {
  const label = h.current
    ? '<span class="pill pill-ok">current</span>'
    : '<span class="pill pill-dim">retired — cannot be re-attested</span>'
  const spans = h.intervals
    .map(i => `${i.from_block} → ${i.to_block ?? '<span class="ok">now</span>'}`).join(', ')
  const head = `<h3>${esc(h.signer)}</h3>
    <dl class="kv">
      <dt></dt><dd>${label}</dd>
      <dt>registered</dt><dd class="mono">${spans} · ${h.code_updates} code update(s)</dd>`

  const st = h.status
  // The trace is worth offering whenever one was captured, retired or not — for a
  // retired signer it is the only record that will ever exist.
  const traceRow = h.trace_events
    ? `<dt>trace</dt><dd>${h.trace_events} measured operations
         <button data-events="${esc(h.signer)}">show</button></dd>`
    : ''

  if (!st) return `<div class="card">${head}
    <dt>verification</dt><dd><span class="pill pill-dim">never attested</span></dd></dl></div>`

  const a = st.attested
  if (!a) return `<div class="card">${head}
      <dt>verification</dt><dd><span class="pill pill-bad">unreachable</span>
        <span class="dim">${esc(st.error || 'failed')}</span></dd>
      <dt>teeUrl</dt><dd>${esc(st.tee_url || '—')}</dd>
      <dt>attempted</dt><dd>${age(now - st.checked_at)}</dd>
    </dl></div>`

  const diff = a.closest
    ? `<span class="pill pill-warn">unknown</span> closest ${a.closest.hits}/${a.closest.total}
       <code>${esc(a.closest.label)}</code>, differs in <b>${a.closest.failed.map(esc).join(', ')}</b>`
    : (a.image ? `<span class="pill pill-ok">✓</span> <code>${esc(a.image)}</code>`
               : '<span class="pill pill-warn">unknown</span>')
  const measured = a.image ? '' : Object.entries(a.measured || {})
    .map(([k, v]) => v.map(d => `${k.padEnd(15)} ${d}`).join('\n')).join('\n')

  return `<div class="card">${head}
      <dt>teeUrl</dt><dd class="mono">${esc(st.tee_url)}</dd>
      <dt>signer bound</dt><dd>${a.signer_ok
        ? `${pill('ok', '✓')} the quote attests this address`
        : `${pill('bad', 'mismatch')} the quote attests
           <code>${esc(a.attested_signer || 'nothing')}</code> — the registered
           identity is not the one this node holds, so neither has standing: the
           registered signer cannot be attested and the attested signer is not
           registered`}</dd>
      <dt>quote</dt><dd><span class="pill pill-ok">✓</span> signature chain verified by the AS</dd>
      <dt>platform TCB</dt><dd>${a.tcb_status === 'UpToDate'
        ? '<span class="ok">UpToDate</span>'
        : `<span class="dim">${esc(a.tcb_status)}</span>` +
          (a.advisories.length
            ? ` — host firmware predates ${a.advisories.length} Intel
                ${a.advisories.length === 1 ? 'advisory' : 'advisories'}:
                <span class="dim">${a.advisories.map(esc).join(', ')}</span>`
            : '')}</dd>
      <dt>boot chain</dt><dd>${diff} <span class="dim">(${esc(a.boot_format)})</span></dd>
      ${traceRow}
      <dt>replay</dt><dd>${a.runtime_replay_ok
        ? '<span class="ok">✓</span> every measured operation reproduces its digest'
        : '<span class="bad">✗ MISMATCH</span>'}</dd>
      <dt>as of</dt><dd>${age(now - st.checked_at)} <span class="dim">(${st.checked_at} unix)</span></dd>
    </dl>${measured ? '<pre class="dim">' + esc(measured) + '</pre>' : ''}</div>`
}

async function showApp(appId) {
  location.hash = encodeURIComponent(appId)
  const d = await get('/api/apps/' + encodeURIComponent(appId))

  // Current signers first, then retired ones newest-first. Different signers are
  // never chained into a longer-lived "node": only updateNode records such a link,
  // most changes are a remove plus an add with nothing tying them together, and
  // even the explicit link is just the owner asserting one replaces the other.
  const current = d.signers.filter(h => h.current)
  const retired = d.signers.filter(h => !h.current).reverse()

  document.getElementById('view').innerHTML = `
    <p><button id="back">← all apps</button></p>
    <h3>${esc(d.app_id)}</h3>
    <p class="dim">${current.length} current signer(s) — these, and only these, can
      obtain the app's KMS key. ${retired.length} retired.</p>
    ${current.map(h => signerCard(h, d.now)).join('')}
    ${retired.length ? '<h3>retired</h3>' : ''}
    ${retired.map(h => signerCard(h, d.now)).join('')}`

  document.getElementById('back').onclick = showList
  document.querySelectorAll('button[data-events]').forEach(b =>
    b.onclick = () => showEvents(appId, b.dataset.events))
}

// The trace belongs to the CVM, not to one app: every app on the machine measures
// into the same RTMR3. So it is shown per app — this app's operations plus the
// machine-scoped ones that carry no app id (docker_login, add_to_whitelist,
// claim_config), which are unattributable and therefore shown under every app on
// that machine. What the co-tenants did is one click away, not hidden: it is all
// measured precisely so it can be inspected.
async function showEvents(appId, signer, scope = 'app') {
  const d = await get(`/api/apps/${encodeURIComponent(appId)}/events` +
                      `?signer=${signer}&scope=${scope}&limit=300`)
  const n = d.nodes[0] || {}
  const rows = (n.events || []).slice().reverse().map(e => {
    const own = e.payload?.app_id
    return `<tr><td class="dim">${e.payload?.timestamp ?? ''}</td>
      <td>${esc(e.operation)}</td>
      <td class="${own ? (own === appId ? '' : 'dim') : 'warn'}">${own ? esc(own)
        : '<span title="no app id — belongs to the machine, not to one app">machine</span>'}</td>
      <td class="${e.payload?.result === 'success' ? 'ok' : 'dim'}">${esc(e.payload?.result ?? '')}</td>
      <td class="dim">${short(e.digest, 8)}</td>
      <td>${e.digest_matches ? '' : '<span class="bad">replay ✗</span>'}</td></tr>`}).join('')

  const tabs = [['app', 'this app + machine'], ['others', 'other apps here'], ['all', 'everything']]
    .map(([s, label]) => s === scope ? `<b>${label}</b>`
      : `<button data-scope="${s}">${label}</button>`).join(' ')

  const card = $(`
    <div class="card"><h3>event log · ${esc(short(signer, 8))}</h3>
      <div class="dim">${tabs}</div>
      <div class="dim">${n.returned} shown of ${n.in_scope} in scope · ${n.trace_total}
        in the machine's whole trace. Newest first.</div>
      <div class="wrap"><table><thead><tr><th>timestamp</th><th>operation</th><th>app</th>
        <th>result</th><th>digest</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>`)
  const view = document.getElementById('view')
  view.querySelector('.card > h3')?.textContent.startsWith('event log') && view.firstElementChild.remove()
  view.insertAdjacentElement('afterbegin', card)
  card.querySelectorAll('button[data-scope]').forEach(b =>
    b.onclick = () => showEvents(appId, signer, b.dataset.scope))
}

const boot = () => location.hash ? showApp(decodeURIComponent(location.hash.slice(1))) : showList()
boot().catch(e => document.getElementById('view').innerHTML =
  '<p class="bad">' + esc(e.message) + '</p>')
</script>
