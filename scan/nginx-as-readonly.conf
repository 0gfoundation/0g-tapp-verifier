# Read-only front for the Attestation Service.
#
# CoCo-AS has no authentication of any kind, so exposing :50004 directly also
# exposes SetAttestationPolicy — anyone able to reach the port can overwrite any
# policy id, and an EAR token records only the policy ID it used, never a hash of
# it, so a client cannot even detect that a policy was swapped. Controlling write
# access is therefore the only real mitigation.
#
# A gRPC method is the HTTP/2 :path, so allowlisting is a location match.

worker_processes 1;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Evidence goes in at a few MB and the token comes back larger, because the
    # event log grows with every measured operation. The defaults are far too small.
    client_max_body_size 64m;
    grpc_buffer_size 1m;
    grpc_read_timeout 300s;
    grpc_send_timeout 300s;

    server {
        listen 50004;
        http2 on;

        # Docker's embedded DNS. Passing the upstream through a VARIABLE defers
        # resolution to request time; naming it directly makes nginx resolve at
        # config load and refuse to start whenever the AS container is not up yet.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $as_upstream as:50004;

        # A policy write redefines what "verified" means, so it needs a key issued
        # against the registry admin's signature. tappscan holds the keys and answers
        # the subrequest; 204 lets the write through, anything else refuses it.
        location = /attestation.AttestationService/SetAttestationPolicy {
            auth_request /_authz;
            grpc_pass grpc://$as_upstream;
        }

        # Internal only — nginx never exposes this, and the shared secret means the
        # check cannot be reached from outside as a key-testing oracle.
        location = /_authz {
            internal;
            set $authz scan:9090;
            proxy_pass http://$authz/internal/authz;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Forwarded-Authorization $http_authorization;
            proxy_set_header X-Authz-Secret "${TAPPSCAN_AUTHZ_SECRET}";
        }

        # Allowed: verifying evidence, and fetching a challenge.
        location = /attestation.AttestationService/AttestationEvaluate {
            grpc_pass grpc://$as_upstream;
        }
        location = /attestation.AttestationService/GetAttestationChallenge {
            grpc_pass grpc://$as_upstream;
        }

        # No JWKS route. The AS documents one on this socket, but the socket is
        # h2c-only — nginx speaks HTTP/1.1 upstream, so only grpc_pass can reach it
        # — and in this build the endpoint answers 200 with an empty body anyway.
        # It is not needed: every token's JWT header carries the full x5c chain, so
        # a client can verify the signature from the token alone.

        # Anything else, including future write methods, is refused by default
        # rather than proxied blindly.
        location / {
            deny all;
        }
    }
}
