[package]
name = "tappscan"
version = "0.1.0"
edition = "2021"
description = "TappRegistry explorer: on-chain app history + attestation status (trust layer 3)"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
ethers = { version = "2.0", default-features = false, features = ["legacy", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
