[package]
name = "tappscan"
version = "0.1.0"
edition = "2021"
description = "TappRegistry explorer: on-chain app history + attestation status (trust layer 3)"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
tonic = "0.12"
prost = "0.13"
base64 = "0.22"
axum = "0.7"
ethers = { version = "2.0", default-features = false, features = ["legacy", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
tonic-build = "0.12"
